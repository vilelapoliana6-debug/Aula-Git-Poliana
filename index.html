<!DOCTYPE html>
<html>
<head>
    <title>Aula de Formulário</title>
    <style>
        /* reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body - Centralizando o formulário na tela */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        /* Formulário e componentes */
        form {
            background-color: LightSteelBlue;
            max-width: 400px;
            margin: 15px;
            padding: 15px;
            border: 2px solid black;
            border-radius: 10px;
        }

        label {
            display: block;
            margin: 5px 0;
            color: black; /* mudei para preto para ler melhor no fundo azul claro */
            font-weight: bold;
        }

        /* Corrigido de 'imput' para 'input' */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid black;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <form>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Ex.: Poliana Carolina" />

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Ex.: email@exemplo.com" />

        <label for="telefone">Telefone</label>
        <input type="tel" name="telefone" id="telefone"
        required placeholder="Ex.: (00) 0000-0000">

        <label for="nascimento">Data de Nascimento</label> <input type="date" name="nascimento" id="nascimento" required>
        
        <button type="submit" style="width: 100%; padding: 10px; cursor: pointer;">Enviar</button>
    </form>
</body>
</html>
